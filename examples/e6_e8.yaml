esphome:
  name: jura-coffee
  # Change friendly_name to match your model
  friendly_name: "Jura E6"  # or "Jura E8"

esp8266:
  board: d1_mini

external_components:
 - source:
      type: git
      url: https://github.com/poindexter12/jura
   components: [jura]

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key
  # Exposes esphome.<node>_send_jura_command in Home Assistant for raw
  # command discovery (see COMMANDS.md). Some commands trigger maintenance
  # cycles -- use with care.
  services:
    - service: send_jura_command
      variables:
        command: string
      then:
        - lambda: id(jura_coffee).send_command(command);

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Jura Coffee Fallback"
    password: !secret fallback_password

captive_portal:

uart:
  tx_pin: D1
  rx_pin: D2
  baud_rate: 9600
  id: uart_bus

# Jura Coffee Machine Component
# Change model to E6 or E8 depending on your machine
jura:
  id: jura_coffee
  uart_id: uart_bus
  model: E6  # Options: E6, E8, F6, F7, UNKNOWN

# Power (optimistic: the machine reports no power state back)
switch:
  - platform: jura
    name: 'Coffee Machine Power'

# Control buttons — native platform; drink names map to FA commands
button:
  - platform: jura
    name: 'Make Espresso'
    drink: espresso

  - platform: jura
    name: 'Make Coffee'
    drink: coffee

  - platform: jura
    name: 'Make Hot Water'
    icon: "mdi:cup-water"
    drink: hot_water

  # Raw command escape hatch, e.g. for command discovery
  - platform: jura
    name: 'Mystery Command'
    command: "FA:0C"

  - platform: restart
    name: Restart
