esphome:
  name: jura-f6
  friendly_name: "Jura F6"

esp8266:
  board: d1_mini

external_components:
 - source:
      type: git
      url: https://github.com/poindexter12/jura
   components: [jura]

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key
  # Exposes esphome.<node>_send_jura_command in Home Assistant for raw
  # command discovery (see COMMANDS.md). Some commands trigger maintenance
  # cycles -- use with care.
  services:
    - service: send_jura_command
      variables:
        command: string
      then:
        - lambda: id(jura_coffee).send_command(command);

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Jura F6 Fallback"
    password: !secret fallback_password

captive_portal:

uart:
  tx_pin: D1
  rx_pin: D2
  baud_rate: 9600
  id: uart_bus

# Jura Coffee Machine Component
jura:
  id: jura_coffee
  uart_id: uart_bus
  model: F6

# Control Buttons
button:
  - platform: template
    name: 'Turn On Coffee Machine'
    icon: "mdi:coffee-maker"
    id: jura_turn_on
    on_press:
      - lambda: |-
          id(jura_coffee).send_command("AN:01");

  - platform: template
    name: 'Turn Off Coffee Machine'
    icon: "mdi:coffee-maker-outline"
    id: jura_turn_off
    on_press:
      - lambda: |-
          id(jura_coffee).send_command("AN:02");

  - platform: template
    name: 'Make Hot Water'
    icon: "mdi:cup-water"
    id: jura_make_hot_water
    on_press:
      - lambda: |-
          id(jura_coffee).send_command("FA:06");

  - platform: template
    name: 'Make Espresso'
    icon: "mdi:coffee"
    id: jura_make_espresso
    on_press:
      - lambda: |-
          id(jura_coffee).send_command("FA:04");

  - platform: template
    name: 'Make Coffee'
    icon: "mdi:coffee"
    id: jura_make_coffee
    on_press:
      - lambda: |-
          id(jura_coffee).send_command("FA:09");

  - platform: restart
    name: Restart
