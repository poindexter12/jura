name: Floating release tags

# Whenever a release is published, force-move the floating tags:
#   v1     -> newest v1.x.y release (no breaking changes within a major)
#   latest -> newest release, period
# Users pin these in esphome external_components with a `refresh:` interval.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  retag:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move floating tags
        run: |
          TAG="${{ github.event.release.tag_name }}"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag $TAG is not vX.Y.Z; skipping"; exit 0 ;;
          esac
          MAJOR="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$TAG"
          git tag -f latest "$TAG"
          git push -f origin "$MAJOR" latest
          echo "Moved $MAJOR and latest -> $TAG"
